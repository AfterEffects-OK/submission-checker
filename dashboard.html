<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課題別 提出状況ダッシュボード</title>
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 24px;
        }
        .container {
            max-width: 1250px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        h2 { margin: 0 0 8px 0; font-size: 26px; font-weight: 800; }
        p.subtitle { margin: 0 0 24px 0; color: var(--text-muted); font-size: 15px; }

        /* プルダウンフィルターエリア */
        .filter-section {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 200px;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .filter-select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #fff;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .filter-select:focus {
            border-color: var(--primary);
        }

        /* テーブルスタイル */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
        }
        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13px;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f8fafc; }

        /* 進捗バーのスタイル */
        .progress-bar-container {
            background: #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            height: 10px;
            width: 100px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        #loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
            margin: 40px 0;
            font-weight: 600;
        }
        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>課題別 提出状況ダッシュボード</h2>
        <p class="subtitle">すべての課題ごとの提出状況と提出率を一覧で確認します。</p>

        <!-- プルダウンによる絞り込みエリア -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="year-select">講義年度</label>
                <select id="year-select" class="filter-select" onchange="onYearChange()">
                    <option value="すべて">すべて</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="lecture-select">科目名 / 講義名</label>
                <select id="lecture-select" class="filter-select" onchange="onLectureChange()">
                    <option value="すべて">すべて</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="kadai-select">課題タイトル</label>
                <select id="kadai-select" class="filter-select" onchange="applyFilters()">
                    <option value="すべて">すべて</option>
                </select>
            </div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <span>全データを読み込み中...</span>
        </div>

        <div class="table-container">
            <table id="dashboard-table" style="display: none;">
                <thead>
                    <tr>
                        <th>講義年度</th>
                        <th>科目名</th>
                        <th>課題タイトル</th>
                        <th>提出期限</th>
                        <th>区分</th>
                        <th style="text-align: center;">提出状況 (提出数 / 対象者数)</th>
                        <th style="text-align: center;">提出率</th>
                    </tr>
                </thead>
                <tbody id="dashboard-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx3nekLkhBtP8owIsAh_cnXWFqmVHAr7qepJXaTXnJirCm-hykjdOevsV238RN9iYtXyg/exec';

        let allTasksData = [];

        window.addEventListener('DOMContentLoaded', function() {
            fetch(GAS_URL + '?mode=dashboard')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    processData(data);
                })
                .catch(error => {
                    document.getElementById('loading').innerHTML = 'データ取得エラーが発生しました: ' + error.message;
                });
        });

        function processData(results) {
            if (!results || results.length === 0) {
                document.getElementById('loading').innerHTML = 'データが見つかりませんでした。';
                return;
            }

            const taskMap = {};
            results.forEach(r => {
                // バックエンドの term は講義年度、submitDate は科目名を表す
                const yearVal = r.term || 'その他';
                const lectureVal = r.submitDate || 'その他';
                const kadaiVal = r.kadaiName || 'その他';
                const key = yearVal + '_' + lectureVal + '_' + kadaiVal;

                if (!taskMap[key]) {
                    taskMap[key] = {
                        year: yearVal,
                        lecture: lectureVal,
                        kadaiName: kadaiVal,
                        deadline: r.deadline || '-',
                        requirement: r.requirement || '-',
                        totalCount: 0,
                        submittedCount: 0
                    };
                }

                taskMap[key].totalCount++;

                let isOriginalSubmitted = (r.isSubmitted === true || r.isSubmitted === 'TRUE' || r.isSubmitted === 'true' || r.isSubmitted === '1');
                if (isOriginalSubmitted) {
                    taskMap[key].submittedCount++;
                }
            });

            allTasksData = Object.values(taskMap);

            updateDropdowns(allTasksData);
            renderDashboard(allTasksData);
        }

        // プルダウンの選択肢を連動して更新する関数
        function updateDropdowns(tasks) {
            const yearSelect = document.getElementById('year-select');
            const lectureSelect = document.getElementById('lecture-select');
            const kadaiSelect = document.getElementById('kadai-select');

            const currentYear = yearSelect.value;
            const currentLecture = lectureSelect.value;
            const currentKadai = kadaiSelect.value;

            // 1. 講義年度の選択肢
            const years = [...new Set(allTasksData.map(t => t.year))].sort().reverse();
            yearSelect.innerHTML = '<option value="すべて">すべて</option>';
            years.forEach(yr => {
                const opt = document.createElement('option');
                opt.value = yr;
                opt.textContent = yr;
                yearSelect.appendChild(opt);
            });
            yearSelect.value = years.includes(currentYear) ? currentYear : 'すべて';

            // 2. 科目名の選択肢（講義年度で絞り込む）
            const filteredByYear = (yearSelect.value === 'すべて') 
                ? allTasksData 
                : allTasksData.filter(t => t.year === yearSelect.value);
            
            const lectures = [...new Set(filteredByYear.map(t => t.lecture))].sort();
            lectureSelect.innerHTML = '<option value="すべて">すべて</option>';
            lectures.forEach(lec => {
                const opt = document.createElement('option');
                opt.value = lec;
                opt.textContent = lec;
                lectureSelect.appendChild(opt);
            });
            lectureSelect.value = lectures.includes(currentLecture) ? currentLecture : 'すべて';

            // 3. 課題タイトルの選択肢（講義年度 ＆ 科目名で絞り込む）
            const filteredByLecture = (lectureSelect.value === 'すべて') 
                ? filteredByYear 
                : filteredByYear.filter(t => t.lecture === lectureSelect.value);

            const kadais = [...new Set(filteredByLecture.map(t => t.kadaiName))].sort();
            kadaiSelect.innerHTML = '<option value="すべて">すべて</option>';
            kadais.forEach(kadai => {
                const opt = document.createElement('option');
                opt.value = kadai;
                opt.textContent = kadai;
                kadaiSelect.appendChild(opt);
            });
            kadaiSelect.value = kadais.includes(currentKadai) ? currentKadai : 'すべて';
        }

        // 講義年度が変更されたとき
        function onYearChange() {
            updateDropdowns(allTasksData);
            applyFilters();
        }

        // 科目名が変更されたとき
        function onLectureChange() {
            updateDropdowns(allTasksData);
            applyFilters();
        }

        // 絞り込み条件に合致するデータを抽出してテーブル描画
        function applyFilters() {
            const selectedYear = document.getElementById('year-select').value;
            const selectedLecture = document.getElementById('lecture-select').value;
            const selectedKadai = document.getElementById('kadai-select').value;

            const filtered = allTasksData.filter(t => {
                const matchYear = (selectedYear === 'すべて' || t.year === selectedYear);
                const matchLecture = (selectedLecture === 'すべて' || t.lecture === selectedLecture);
                const matchKadai = (selectedKadai === 'すべて' || t.kadaiName === selectedKadai);
                return matchYear && matchLecture && matchKadai;
            });

            renderDashboard(filtered);
        }

        function renderDashboard(tasks) {
            const tbody = document.getElementById('dashboard-body');
            let html = '';

            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 30px;">該当するデータが見つかりませんでした。</td></tr>';
                document.getElementById('dashboard-table').style.display = 'table';
                return;
            }

            tasks.forEach(task => {
                const percentage = task.totalCount > 0 ? Math.round((task.submittedCount / task.totalCount) * 100) : 0;
                let reqClass = (task.requirement && (task.requirement.includes('必') || task.requirement.includes('必須'))) ? 'color: #0369a1; font-weight: 700;' : 'color: #64748b;';

                html += '<tr>';
                html += '<td style="font-weight: 600; color: var(--text-muted);">' + escapeHtml(task.year) + '</td>';
                html += '<td style="font-weight: 600;">' + escapeHtml(task.lecture) + '</td>';
                html += '<td style="font-weight: 700;">' + escapeHtml(task.kadaiName) + '</td>';
                html += '<td style="color: var(--text-muted);">' + escapeHtml(task.deadline) + '</td>';
                html += '<td><span style="' + reqClass + '">' + escapeHtml(task.requirement) + '</span></td>';
                html += '<td style="text-align: center; font-weight: 600;">' + task.submittedCount + ' / ' + task.totalCount + ' 人</td>';
                html += '<td style="text-align: center;">';
                html += '<div class="progress-bar-container"><div class="progress-bar-fill" style="width: ' + percentage + '%;"></div></div>';
                html += '<span style="font-weight: 700; font-size: 14px;">' + percentage + '%</span>';
                html += '</td>';
                html += '</tr>';
            });

            tbody.innerHTML = html;
            document.getElementById('dashboard-table').style.display = 'table';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>

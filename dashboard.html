<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課題別 提出状況ダッシュボード</title>
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/AfterEffects-OK/submission-checker/main/watermarked_img_17656930725140942704.jpg">
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --filter-bg: #f8fafc;
            --sub-bg: #ffffff;
        }

        /* ダークモード時のカラー定義 */
        [data-theme="dark"] {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --filter-bg: #0f172a;
            --sub-bg: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 24px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .container {
            max-width: 1400px; /* コンテナの最大幅を少し拡大 */
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        /* ヘッダーエリア（タイトルとテーマ切り替えボタン） */
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        h2 { margin: 0 0 8px 0; font-size: 26px; font-weight: 800; }
        p.subtitle { margin: 0; color: var(--text-muted); font-size: 15px; }

        /* モード切り替えボタン */
        .theme-toggle-btn {
            background: var(--filter-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .theme-toggle-btn:hover {
            border-color: var(--primary);
        }

        /* プルダウンフィルターエリア（ラベルを左側の横並び） */
        .filter-section {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: var(--filter-bg);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 280px;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .filter-select {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }
        .filter-select:focus {
            border-color: var(--primary);
        }

        /* テーブルスタイル */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--card-bg);
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
            transition: border-color 0.2s ease;
        }
        th {
            background-color: var(--filter-bg);
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
        }
        /* ソート可能なヘッダーのスタイル */
        th.sortable {
            cursor: pointer;
            user-select: none;
            transition: color 0.15s ease, background-color 0.15s ease;
        }
        th.sortable:hover {
            color: var(--primary);
            background-color: rgba(5, 150, 105, 0.05);
        }
        tr:last-child > td { border-bottom: none; }
        
        /* 行クリックのインタラクティブ演出 */
        .clickable-row {
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .clickable-row:hover td {
            background-color: rgba(5, 150, 105, 0.08);
        }
        .clickable-row.expanded td {
            background-color: rgba(5, 150, 105, 0.12);
            border-bottom: none;
        }

        /* 詳細展開行のスタイル */
        .detail-row {
            display: none;
            background-color: var(--filter-bg);
        }
        .detail-row.active {
            display: table-row;
        }
        .detail-cell {
            padding: 0 20px 20px 20px !important;
            background-color: var(--filter-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .detail-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .detail-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 学生カードの自動グリッドレイアウト（最大幅190px制限） */
        .student-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 190px));
            gap: 12px;
        }
        .student-card {
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.1s ease, border-color 0.15s ease, background-color 0.2s ease;
        }
        
        /* 提出済みカード（非常に薄い緑） */
        .student-card.submitted {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }
        .student-card.submitted:hover {
            border-color: rgba(16, 185, 129, 0.5);
        }

        /* 未提出カード（非常に薄い赤） */
        .student-card.unsubmitted {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }
        .student-card.unsubmitted:hover {
            border-color: rgba(239, 68, 68, 0.5);
        }

        /* 評価不能カード（非常に薄い黄色） */
        .student-card.unknown {
            background: rgba(234, 179, 8, 0.08);
            border: 1px solid rgba(234, 179, 8, 0.25);
        }
        .student-card.unknown:hover {
            border-color: rgba(234, 179, 8, 0.5);
        }

        .student-card-name {
            font-weight: 800;
            font-size: 22px;
            color: var(--text-main);
            white-space: nowrap;
            margin-right: 6px;
            transform-origin: left center;
            display: inline-block;
        }

        /* 提出済み・未提出・評価不能のバッジ */
        .badge-submitted {
            background: #047857;
            color: #ecfdf5;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .badge-unsubmitted {
            background: #b91c1c;
            color: #fef2f2;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .badge-unknown {
            background: #ca8a04;
            color: #fefce8;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .td-lecture {
            font-weight: 600;
            white-space: pre-wrap;
            word-break: normal;
            overflow-wrap: break-word;
        }
        .td-requirement {
            white-space: nowrap;
        }
        .td-status {
            text-align: center;
            white-space: nowrap;
            font-feature-settings: "tnum";
        }
        .submitted-num {
            font-weight: 700;
            color: var(--text-main);
            font-size: 16px;
        }
        .total-num {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
        }

        /* 進捗バーのスタイル */
        .progress-bar-container {
            background: var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            height: 10px;
            width: 100px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        #loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
            margin: 40px 0;
            font-weight: 600;
        }
        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-flex">
            <div>
                <h2>課題別 提出状況ダッシュボード</h2>
                <p class="subtitle">リストの行をクリックすると、その下に学生ごとの提出カードが展開されます。</p>
            </div>
            <!-- モード切り替えボタン（太陽・月のアイコン対応） -->
            <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="toggleTheme()" title="表示モード切替">
                <span id="theme-text">ライトモード</span>
            </button>
        </div>

        <!-- プルダウンによる絞り込みエリア（ラベルが左側の横並び） -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="lecture-select">講義名</label>
                <select id="lecture-select" class="filter-select" onchange="onLectureChange()">
                    <option value="すべて">すべて</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="kadai-select">課題タイトル</label>
                <select id="kadai-select" class="filter-select" onchange="applyFilters()">
                    <option value="すべて">すべて</option>
                </select>
            </div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <span>全データを読み込み中...</span>
        </div>

        <div class="table-container">
            <table id="dashboard-table" style="display: none;">
                <thead>
                    <tr>
                        <th>科目名</th>
                        <th>課題タイトル</th>
                        <th>提出期限</th>
                        <th class="sortable" onclick="sortTable('requirement')">区分 <span id="sort-icon-requirement">▲</span></th>
                        <th style="text-align: center;">提出状況 (提出数 / 対象者数)</th>
                        <th style="text-align: center;">提出率</th>
                    </tr>
                </thead>
                <tbody id="dashboard-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- テーマ（ライト/ダークモード）初期化と切り替え処理 ---
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();

        window.addEventListener('DOMContentLoaded', () => {
            updateThemeButtonUI();

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                if (!localStorage.getItem('theme')) {
                    document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
                    updateThemeButtonUI();
                }
            });
        });

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButtonUI();
        }

        function updateThemeButtonUI() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const text = document.getElementById('theme-text');
            if (!text) return;

            if (currentTheme === 'dark') {
                text.textContent = '☀️ ライトモード';
            } else {
                text.textContent = '🌙 ダークモード';
            }
        }
        // --------------------------------------------------------

        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx3nekLkhBtP8owIsAh_cnXWFqmVHAr7qepJXaTXnJirCm-hykjdOevsV238RN9iYtXyg/exec';

        let allTasksData = [];
        let currentSortDirection = 'asc'; // デフォルトは昇順 (asc)
        let expandedRowKeys = new Set(); // 開いているアコーディオンのキーを保持

        window.addEventListener('DOMContentLoaded', function() {
            fetch(GAS_URL + '?mode=dashboard')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    processData(data);
                })
                .catch(error => {
                    document.getElementById('loading').innerHTML = 'データ取得エラーが発生しました: ' + error.message;
                });
        });

        function processData(results) {
            if (!results || results.length === 0) {
                document.getElementById('loading').innerHTML = 'データが見つかりませんでした。';
                return;
            }

            const taskMap = {};
            results.forEach(r => {
                const lectureVal = r.submitDate || 'その他';
                const kadaiVal = r.kadaiName || 'その他';
                const key = lectureVal + '_' + kadaiVal;

                if (!taskMap[key]) {
                    taskMap[key] = {
                        lecture: lectureVal,
                        kadaiName: kadaiVal,
                        deadline: r.deadline || '-',
                        requirement: r.requirement || '-',
                        totalCount: 0,
                        submittedCount: 0,
                        students: []
                    };
                }

                taskMap[key].totalCount++;
                let isOriginalSubmitted = (r.isSubmitted === true || r.isSubmitted === 'TRUE' || r.isSubmitted === 'true' || r.isSubmitted === '1');
                if (isOriginalSubmitted) {
                    taskMap[key].submittedCount++;
                }

                taskMap[key].students.push({
                    name: r.studentName,
                    status: r.isSubmitted,
                    isSubmitted: isOriginalSubmitted,
                    fileName: r.fileName || '-'
                });
            });

            allTasksData = Object.values(taskMap);

            updateDropdowns(allTasksData);
            applyFilters(); // 読み込み時からソート＆フィルターを適用
        }

        function updateDropdowns(tasks) {
            const lectureSelect = document.getElementById('lecture-select');
            const kadaiSelect = document.getElementById('kadai-select');

            const currentLecture = lectureSelect.value;
            const currentKadai = kadaiSelect.value;

            // 講義名セレクトの更新
            const lectures = [...new Set(allTasksData.map(t => t.lecture))].sort();
            lectureSelect.innerHTML = '<option value="すべて">すべて</option>';
            lectures.forEach(lec => {
                const opt = document.createElement('option');
                opt.value = lec;
                opt.textContent = lec;
                lectureSelect.appendChild(opt);
            });
            lectureSelect.value = lectures.includes(currentLecture) ? currentLecture : 'すべて';

            // 課題セレクトの更新（講義名で絞り込み可能）
            const filteredByLecture = (lectureSelect.value === 'すべて') 
                ? allTasksData 
                : allTasksData.filter(t => t.lecture === lectureSelect.value);

            const kadais = [...new Set(filteredByLecture.map(t => t.kadaiName))].sort();
            kadaiSelect.innerHTML = '<option value="すべて">すべて</option>';
            kadais.forEach(kadai => {
                const opt = document.createElement('option');
                opt.value = kadai;
                opt.textContent = kadai;
                kadaiSelect.appendChild(opt);
            });
            kadaiSelect.value = kadais.includes(currentKadai) ? currentKadai : 'すべて';
        }

        function onLectureChange() {
            updateDropdowns(allTasksData);
            applyFilters();
        }

        function applyFilters() {
            const selectedLecture = document.getElementById('lecture-select').value;
            const selectedKadai = document.getElementById('kadai-select').value;

            let filtered = allTasksData.filter(t => {
                const matchLecture = (selectedLecture === 'すべて' || t.lecture === selectedLecture);
                const matchKadai = (selectedKadai === 'すべて' || t.kadaiName === selectedKadai);
                return matchLecture && matchKadai;
            });

            // 区分（requirement）によるソートを実行
            filtered.sort((a, b) => {
                let valA = a.requirement || '';
                let valB = b.requirement || '';
                let comparison = valA.localeCompare(valB, 'ja');
                return currentSortDirection === 'asc' ? comparison : -comparison;
            });

            renderDashboard(filtered);
        }

        // 区分列でのソート処理
        function sortTable(column) {
            // 昇順・降順を切り替え
            currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
            
            const icon = document.getElementById('sort-icon-' + column);
            if (icon) {
                icon.textContent = currentSortDirection === 'asc' ? '▲' : '▼';
            }

            applyFilters();
        }

        function renderDashboard(tasks) {
            const tbody = document.getElementById('dashboard-body');
            let html = '';

            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">該当するデータが見つかりませんでした。</td></tr>';
                document.getElementById('dashboard-table').style.display = 'table';
                return;
            }

            tasks.forEach((task, index) => {
                const percentage = task.totalCount > 0 ? Math.round((task.submittedCount / task.totalCount) * 100) : 0;
                let reqClass = (task.requirement && (task.requirement.includes('必') || task.requirement.includes('必須'))) ? 'color: #0369a1; font-weight: 700;' : 'color: var(--text-muted);';
                let formattedLecture = escapeHtml(task.lecture).replace(/\(/g, '<wbr>(').replace(/（/g, '<wbr>（');

                const rowId = 'detail-row-' + index;
                const mainRowId = 'main-row-' + index;
                const taskKey = task.lecture + '_' + task.kadaiName;
                const isExpanded = expandedRowKeys.has(taskKey);

                const mainRowClass = isExpanded ? 'clickable-row expanded' : 'clickable-row';
                const detailRowClass = isExpanded ? 'detail-row active' : 'detail-row';

                html += '<tr class="' + mainRowClass + '" id="' + mainRowId + '" onclick="toggleDetail(\'' + rowId + '\', \'' + mainRowId + '\', \'' + escapeHtml(taskKey) + '\')">';
                html += '<td class="td-lecture">' + formattedLecture + '</td>';
                html += '<td style="font-weight: 700;">' + escapeHtml(task.kadaiName) + '</td>';
                html += '<td style="color: var(--text-muted);">' + escapeHtml(task.deadline) + '</td>';
                html += '<td class="td-requirement"><span style="' + reqClass + '">' + escapeHtml(task.requirement) + '</span></td>';
                
                html += '<td class="td-status">';
                html += '<span class="submitted-num">' + task.submittedCount + '</span>';
                html += '<span style="color: var(--text-muted); margin: 0 4px;">/</span>';
                html += '<span class="total-num">' + task.totalCount + '人</span>';
                html += '</td>';

                html += '<td style="text-align: center;">';
                html += '<div class="progress-bar-container"><div class="progress-bar-fill" style="width: ' + percentage + '%;"></div></div>';
                html += '<span style="font-weight: 700; font-size: 14px;">' + percentage + '%</span>';
                html += '</td>';
                html += '</tr>';

                // 学生カード展開行
                html += '<tr class="' + detailRowClass + '" id="' + rowId + '">';
                html += '<td colspan="6" class="detail-cell">';
                html += '<div class="detail-box">';
                html += '<div class="detail-title"><span>📋 「' + escapeHtml(task.kadaiName) + '」の学生別提出状況</span></div>';
                html += '<div class="student-cards-grid">';

                task.students.sort((a, b) => a.name.localeCompare(b.name, 'ja'));

                task.students.forEach(st => {
                    let cardClass = 'student-card unsubmitted';
                    let badge = '<span class="badge-unsubmitted">未提出</span>';

                    if (st.status === '評価不能' || st.status === '判定不能') {
                        cardClass = 'student-card unknown';
                        badge = '<span class="badge-unknown">評価不能</span>';
                    } else if (st.isSubmitted) {
                        cardClass = 'student-card submitted';
                        badge = '<span class="badge-submitted">提出済み</span>';
                    }

                    html += '<div class="' + cardClass + '">';
                    html += '<div style="overflow: hidden; flex-grow: 1; margin-right: 6px;">';
                    html += '<span class="student-card-name" title="' + escapeHtml(st.name) + '">' + escapeHtml(st.name) + '</span>';
                    html += '</div>';
                    html += badge;
                    html += '</div>';
                });

                html += '</div>'; // student-cards-grid
                html += '</div>'; // detail-box
                html += '</td>';
                html += '</tr>';
            });

            tbody.innerHTML = html;
            document.getElementById('dashboard-table').style.display = 'table';

            // 描画されたカードの文字スケール調整を実行
            setTimeout(adjustCardNames, 10);
        }

        // カードが描画された後に文字数に応じてスケール（横幅縮小）を自動調整する処理
        function adjustCardNames() {
            document.querySelectorAll('.student-card-name').forEach(el => {
                const parent = el.parentElement;
                if (el.scrollWidth > parent.clientWidth && parent.clientWidth > 0) {
                    const scale = parent.clientWidth / el.scrollWidth;
                    el.style.transform = `scaleX(${scale})`;
                } else {
                    el.style.transform = 'scaleX(1)';
                }
            });
        }

        function toggleDetail(rowId, mainRowId, taskKey) {
            const detailRow = document.getElementById(rowId);
            const mainRow = document.getElementById(mainRowId);

            if (detailRow.classList.contains('active')) {
                detailRow.classList.remove('active');
                mainRow.classList.remove('expanded');
                expandedRowKeys.delete(taskKey); // 開き状態を削除
            } else {
                detailRow.classList.add('active');
                mainRow.classList.add('expanded');
                expandedRowKeys.add(taskKey); // 開き状態を記録
                setTimeout(adjustCardNames, 10);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>

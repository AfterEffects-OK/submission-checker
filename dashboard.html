<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課題別 提出状況ダッシュボード</title>
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 24px;
        }
        .container {
            max-width: 1250px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        h2 { margin: 0 0 8px 0; font-size: 26px; font-weight: 800; }
        p.subtitle { margin: 0 0 32px 0; color: var(--text-muted); font-size: 15px; }
        
        /* テーブルスタイル */
        .table-container { width: 100%; overflow-x: auto; margin-top: 20px; border: 1px solid var(--border-color); border-radius: 12px; background: #fff; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-size: 15px; }
        th { background-color: #f8fafc; color: var(--text-muted); font-weight: 700; font-size: 13px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f8fafc; }
        
        /* 進捗バーのスタイル */
        .progress-bar-container { background: #e2e8f0; border-radius: 8px; overflow: hidden; height: 10px; width: 100px; display: inline-block; vertical-align: middle; margin-right: 8px; }
        .progress-bar-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.4s ease; }
        
        #loading { display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--text-muted); margin: 40px 0; font-weight: 600; }
        .spinner { width: 22px; height: 22px; border: 3px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h2>課題別 提出状況ダッシュボード</h2>
        <p class="subtitle">すべての課題ごとの提出状況と提出率を一覧で確認します。</p>

        <!-- ▼ 追加：フィルターボタンのエリア -->
        <div id="filter-buttons" style="margin-bottom: 24px; display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="filter-btn active" data-filter="すべて" style="padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--primary); color: #fff; cursor: pointer; font-weight: 600;">すべて</button>
            <!-- ここに講義名などのボタンがJSで自動生成されるようにすると便利です -->
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <span>全データを読み込み中...</span>
        </div>

        <div class="table-container">
            <table id="dashboard-table" style="display: none;">
                <thead>
                    <tr>
                        <th>講義名</th>
                        <th>課題タイトル</th>
                        <th>提出期限</th>
                        <th>区分</th>
                        <th style="text-align: center;">提出状況 (提出数 / 対象者数)</th>
                        <th style="text-align: center;">提出率</th>
                    </tr>
                </thead>
                <tbody id="dashboard-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // バックエンド（GAS）のWebアプリURL
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx3nekLkhBtP8owIsAh_cnXWFqmVHAr7qepJXaTXnJirCm-hykjdOevsV238RN9iYtXyg/exec';

        let allTasksData = []; // 取得した全タスクデータを保持する変数
        let currentFilter = 'すべて'; // 現在選択されているフィルター

        // ページ読み込み時に自動で全データを取得
        window.addEventListener('DOMContentLoaded', function() {
            fetch(GAS_URL + '?keyword=')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    processData(data);
                })
                .catch(error => {
                    document.getElementById('loading').innerHTML = 'データ取得エラーが発生しました: ' + error.message;
                });
        });

        // データをグループ化して保持し、ボタンとテーブルを初期描画
        function processData(results) {
            if (!results || results.length === 0) {
                document.getElementById('loading').innerHTML = 'データが見つかりませんでした。';
                return;
            }

            const taskMap = {};
            results.forEach(r => {
                const key = r.submitDate + '_' + r.kadaiName;
                if (!taskMap[key]) {
                    taskMap[key] = {
                        lecture: r.submitDate,
                        kadaiName: r.kadaiName,
                        deadline: r.deadline,
                        requirement: r.requirement,
                        totalCount: 0,
                        submittedCount: 0
                    };
                }

                taskMap[key].totalCount++;

                let isOriginalSubmitted = (r.isSubmitted === true || r.isSubmitted === 'TRUE' || r.isSubmitted === 'true' || r.isSubmitted === '1');
                if (isOriginalSubmitted) {
                    taskMap[key].submittedCount++;
                }
            });

            allTasksData = Object.values(taskMap);

            // フィルターボタンを自動生成
            generateFilterButtons(allTasksData);

            // テーブルを描画
            renderDashboard(allTasksData);
        }

        // 課題（または講義名）ごとのボタンを自動生成する関数
        function generateFilterButtons(tasks) {
            const filterContainer = document.getElementById('filter-buttons');
            
            // 「すべて」ボタンを残して他をクリア
            filterContainer.innerHTML = '<button class="filter-btn active" data-filter="すべて" onclick="filterTable(\'すべて\', this)">すべて</button>';

            // 課題名の一覧からボタンを生成
            tasks.forEach(task => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.filter = task.kadaiName;
                btn.textContent = task.kadaiName;
                btn.onclick = function() {
                    filterTable(task.kadaiName, this);
                };
                filterContainer.appendChild(btn);
            });
        }

        // ボタンがクリックされたときの絞り込み処理
        function filterTable(targetKadai, clickedBtn) {
            currentFilter = targetKadai;

            // アクティブなボタンのスタイル切り替え
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.style.background = '#fff';
                btn.style.color = 'var(--text-main)';
                btn.style.borderColor = 'var(--border-color)';
            });
            clickedBtn.classList.add('active');
            clickedBtn.style.background = 'var(--primary)';
            clickedBtn.style.color = '#fff';
            clickedBtn.style.borderColor = 'var(--primary)';

            // データのフィルタリング
            if (targetKadai === 'すべて') {
                renderDashboard(allTasksData);
            } else {
                const filtered = allTasksData.filter(t => t.kadaiName === targetKadai);
                renderDashboard(filtered);
            }
        }

        // 共通のボタンスタイルを適用するためのCSSをHTML内に追加しておくための補助
        // （見た目をきれいにするスタイル）
        const styleTag = document.createElement('style');
        styleTag.innerHTML = `
            .filter-btn {
                padding: 8px 16px;
                border-radius: 8px;
                border: 1px solid var(--border-color);
                background: #fff;
                color: var(--text-main);
                cursor: pointer;
                font-weight: 600;
                font-size: 14px;
                transition: all 0.2s ease;
            }
            .filter-btn.active {
                background: var(--primary);
                color: #fff;
                border-color: var(--primary);
            }
            .filter-btn:hover {
                border-color: var(--primary);
            }
        `;
        document.head.appendChild(styleTag);

        // テーブルに描画する関数
        function renderDashboard(tasks) {
            const tbody = document.getElementById('dashboard-body');
            let html = '';

            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">該当するデータが見つかりませんでした。</td></tr>';
                document.getElementById('dashboard-table').style.display = 'table';
                return;
            }

            tasks.forEach(task => {
                const percentage = task.totalCount > 0 ? Math.round((task.submittedCount / task.totalCount) * 100) : 0;
                let reqClass = (task.requirement && (task.requirement.includes('必') || task.requirement.includes('必須'))) ? 'color: #0369a1; font-weight: 700;' : 'color: #64748b;';

                html += '<tr>';
                html += '<td style="font-weight: 600;">' + escapeHtml(task.lecture) + '</td>';
                html += '<td style="font-weight: 700;">' + escapeHtml(task.kadaiName) + '</td>';
                html += '<td style="color: var(--text-muted);">' + escapeHtml(task.deadline) + '</td>';
                html += '<td><span style="' + reqClass + '">' + escapeHtml(task.requirement) + '</span></td>';
                html += '<td style="text-align: center; font-weight: 600;">' + task.submittedCount + ' / ' + task.totalCount + ' 人</td>';
                html += '<td style="text-align: center;">';
                html += '<div class="progress-bar-container"><div class="progress-bar-fill" style="width: ' + percentage + '%;"></div></div>';
                html += '<span style="font-weight: 700; font-size: 14px;">' + percentage + '%</span>';
                html += '</td>';
                html += '</tr>';
            });

            tbody.innerHTML = html;
            document.getElementById('dashboard-table').style.display = 'table';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課題別 提出状況ダッシュボード</title>
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 24px;
        }
        .container {
            max-width: 1250px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        h2 { margin: 0 0 8px 0; font-size: 26px; font-weight: 800; }
        p.subtitle { margin: 0 0 24px 0; color: var(--text-muted); font-size: 15px; }

        /* プルダウンフィルターエリア */
        .filter-section {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 250px;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .filter-select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #fff;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .filter-select:focus {
            border-color: var(--primary);
        }

        /* テーブルスタイル */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
        }
        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
        }
        tr:last-child > td { border-bottom: none; }
        
        /* 行クリックのインタラクティブ演出 */
        .clickable-row {
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .clickable-row:hover td {
            background-color: #f0fdf4;
        }
        .clickable-row.expanded td {
            background-color: #ecfdf5;
            border-bottom: none;
        }

        /* 詳細展開行のスタイル */
        .detail-row {
            display: none;
            background-color: #f8fafc;
        }
        .detail-row.active {
            display: table-row;
        }
        .detail-cell {
            padding: 0 20px 20px 20px !important;
            background-color: #f8fafc;
            border-bottom: 1px solid var(--border-color);
        }
        .detail-box {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .detail-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 学生カードの自動グリッドレイアウト（最大幅200px制限） */
        .student-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 200px));
            gap: 12px;
        }
        .student-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.1s ease;
        }
        .student-card:hover {
            border-color: #cbd5e1;
        }
        .student-card-name {
            font-weight: 800;
            font-size: 22px; /* さらに大きなフォントサイズに拡大 */
            color: var(--text-main);
            white-space: nowrap;
            margin-right: 6px;
            /* 長い文字の場合に横幅を縮小してカード内に収める */
            transform-origin: left center;
            display: inline-block;
        }

        /* 提出済み・未提出のバッジ (index.html 準拠) */
        .badge-submitted {
            background: #d1fae5;
            color: #065f46;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .badge-unsubmitted {
            background: #fee2e2;
            color: #991b1b;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .td-lecture {
            font-weight: 600;
            white-space: pre-wrap;
            word-break: normal;
            overflow-wrap: break-word;
        }
        .td-requirement {
            white-space: nowrap;
        }
        .td-status {
            text-align: center;
            white-space: nowrap;
            font-feature-settings: "tnum";
        }
        .submitted-num {
            font-weight: 700;
            color: var(--text-main);
            font-size: 16px;
        }
        .total-num {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
        }

        /* 進捗バーのスタイル */
        .progress-bar-container {
            background: #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            height: 10px;
            width: 100px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        #loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
            margin: 40px 0;
            font-weight: 600;
        }
        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>課題別 提出状況ダッシュボード</h2>
        <p class="subtitle">リストの行をクリックすると、その下に学生ごとの提出カードが展開されます。</p>

        <!-- プルダウンによる絞り込みエリア -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="lecture-select">科目名 / 講義名</label>
                <select id="lecture-select" class="filter-select" onchange="onLectureChange()">
                    <option value="すべて">すべて</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="kadai-select">課題タイトル</label>
                <select id="kadai-select" class="filter-select" onchange="applyFilters()">
                    <option value="すべて">すべて</option>
                </select>
            </div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <span>全データを読み込み中...</span>
        </div>

        <div class="table-container">
            <table id="dashboard-table" style="display: none;">
                <thead>
                    <tr>
                        <th>科目名</th>
                        <th>課題タイトル</th>
                        <th>提出期限</th>
                        <th>区分</th>
                        <th style="text-align: center;">提出状況 (提出数 / 対象者数)</th>
                        <th style="text-align: center;">提出率</th>
                    </tr>
                </thead>
                <tbody id="dashboard-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx3nekLkhBtP8owIsAh_cnXWFqmVHAr7qepJXaTXnJirCm-hykjdOevsV238RN9iYtXyg/exec';

        let allTasksData = [];

        window.addEventListener('DOMContentLoaded', function() {
            fetch(GAS_URL + '?mode=dashboard')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    processData(data);
                })
                .catch(error => {
                    document.getElementById('loading').innerHTML = 'データ取得エラーが発生しました: ' + error.message;
                });
        });

        function processData(results) {
            if (!results || results.length === 0) {
                document.getElementById('loading').innerHTML = 'データが見つかりませんでした。';
                return;
            }

            const taskMap = {};
            results.forEach(r => {
                const lectureVal = r.submitDate || 'その他';
                const kadaiVal = r.kadaiName || 'その他';
                const key = lectureVal + '_' + kadaiVal;

                if (!taskMap[key]) {
                    taskMap[key] = {
                        lecture: lectureVal,
                        kadaiName: kadaiVal,
                        deadline: r.deadline || '-',
                        requirement: r.requirement || '-',
                        totalCount: 0,
                        submittedCount: 0,
                        students: []
                    };
                }

                taskMap[key].totalCount++;
                let isOriginalSubmitted = (r.isSubmitted === true || r.isSubmitted === 'TRUE' || r.isSubmitted === 'true' || r.isSubmitted === '1');
                if (isOriginalSubmitted) {
                    taskMap[key].submittedCount++;
                }

                taskMap[key].students.push({
                    name: r.studentName,
                    isSubmitted: isOriginalSubmitted,
                    fileName: r.fileName || '-'
                });
            });

            allTasksData = Object.values(taskMap);

            updateDropdowns(allTasksData);
            renderDashboard(allTasksData);
        }

        function updateDropdowns(tasks) {
            const lectureSelect = document.getElementById('lecture-select');
            const kadaiSelect = document.getElementById('kadai-select');

            const currentLecture = lectureSelect.value;
            const currentKadai = kadaiSelect.value;

            const lectures = [...new Set(allTasksData.map(t => t.lecture))].sort();
            lectureSelect.innerHTML = '<option value="すべて">すべて</option>';
            lectures.forEach(lec => {
                const opt = document.createElement('option');
                opt.value = lec;
                opt.textContent = lec;
                lectureSelect.appendChild(opt);
            });
            lectureSelect.value = lectures.includes(currentLecture) ? currentLecture : 'すべて';

            const filteredByLecture = (lectureSelect.value === 'すべて') 
                ? allTasksData 
                : allTasksData.filter(t => t.lecture === lectureSelect.value);

            const kadais = [...new Set(filteredByLecture.map(t => t.kadaiName))].sort();
            kadaiSelect.innerHTML = '<option value="すべて">すべて</option>';
            kadais.forEach(kadai => {
                const opt = document.createElement('option');
                opt.value = kadai;
                opt.textContent = kadai;
                kadaiSelect.appendChild(opt);
            });
            kadaiSelect.value = kadais.includes(currentKadai) ? currentKadai : 'すべて';
        }

        function onLectureChange() {
            updateDropdowns(allTasksData);
            applyFilters();
        }

        function applyFilters() {
            const selectedLecture = document.getElementById('lecture-select').value;
            const selectedKadai = document.getElementById('kadai-select').value;

            const filtered = allTasksData.filter(t => {
                const matchLecture = (selectedLecture === 'すべて' || t.lecture === selectedLecture);
                const matchKadai = (selectedKadai === 'すべて' || t.kadaiName === selectedKadai);
                return matchLecture && matchKadai;
            });

            renderDashboard(filtered);
        }

        function renderDashboard(tasks) {
            const tbody = document.getElementById('dashboard-body');
            let html = '';

            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">該当するデータが見つかりませんでした。</td></tr>';
                document.getElementById('dashboard-table').style.display = 'table';
                return;
            }

            tasks.forEach((task, index) => {
                const percentage = task.totalCount > 0 ? Math.round((task.submittedCount / task.totalCount) * 100) : 0;
                let reqClass = (task.requirement && (task.requirement.includes('必') || task.requirement.includes('必須'))) ? 'color: #0369a1; font-weight: 700;' : 'color: #64748b;';
                let formattedLecture = escapeHtml(task.lecture).replace(/\(/g, '<wbr>(').replace(/（/g, '<wbr>（');

                const rowId = 'detail-row-' + index;

                html += '<tr class="clickable-row" id="main-row-' + index + '" onclick="toggleDetail(\'' + rowId + '\', \'main-row-' + index + '\')">';
                html += '<td class="td-lecture">' + formattedLecture + '</td>';
                html += '<td style="font-weight: 700;">' + escapeHtml(task.kadaiName) + '</td>';
                html += '<td style="color: var(--text-muted);">' + escapeHtml(task.deadline) + '</td>';
                html += '<td class="td-requirement"><span style="' + reqClass + '">' + escapeHtml(task.requirement) + '</span></td>';
                
                html += '<td class="td-status">';
                html += '<span class="submitted-num">' + task.submittedCount + '</span>';
                html += '<span style="color: var(--text-muted); margin: 0 4px;">/</span>';
                html += '<span class="total-num">' + task.totalCount + '人</span>';
                html += '</td>';

                html += '<td style="text-align: center;">';
                html += '<div class="progress-bar-container"><div class="progress-bar-fill" style="width: ' + percentage + '%;"></div></div>';
                html += '<span style="font-weight: 700; font-size: 14px;">' + percentage + '%</span>';
                html += '</td>';
                html += '</tr>';

                // 学生カード展開行
                html += '<tr class="detail-row" id="' + rowId + '">';
                html += '<td colspan="6" class="detail-cell">';
                html += '<div class="detail-box">';
                html += '<div class="detail-title"><span>📋 「' + escapeHtml(task.kadaiName) + '」の学生別提出状況</span></div>';
                html += '<div class="student-cards-grid">';

                task.students.sort((a, b) => a.name.localeCompare(b.name, 'ja'));

                task.students.forEach(st => {
                    let badge = st.isSubmitted 
                        ? '<span class="badge-submitted">提出済み</span>' 
                        : '<span class="badge-unsubmitted">未提出</span>';

                    html += '<div class="student-card">';
                    html += '<div style="overflow: hidden; flex-grow: 1; margin-right: 6px;">';
                    html += '<span class="student-card-name" title="' + escapeHtml(st.name) + '">' + escapeHtml(st.name) + '</span>';
                    html += '</div>';
                    html += badge;
                    html += '</div>';
                });

                html += '</div>'; // student-cards-grid
                html += '</div>'; // detail-box
                html += '</td>';
                html += '</tr>';
            });

            tbody.innerHTML = html;
            document.getElementById('dashboard-table').style.display = 'table';
        }

        // カードが描画された後に文字数に応じてスケール（横幅縮小）を自動調整する処理
        function adjustCardNames() {
            document.querySelectorAll('.student-card-name').forEach(el => {
                const parent = el.parentElement;
                if (el.scrollWidth > parent.clientWidth && parent.clientWidth > 0) {
                    const scale = parent.clientWidth / el.scrollWidth;
                    el.style.transform = `scaleX(${scale})`;
                } else {
                    el.style.transform = 'scaleX(1)';
                }
            });
        }

        function toggleDetail(rowId, mainRowId) {
            const detailRow = document.getElementById(rowId);
            const mainRow = document.getElementById(mainRowId);

            if (detailRow.classList.contains('active')) {
                detailRow.classList.remove('active');
                mainRow.classList.remove('expanded');
            } else {
                detailRow.classList.add('active');
                mainRow.classList.add('expanded');
                setTimeout(adjustCardNames, 10);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
